name: plan
backend: claude
max_bounces: 999

vars:
  GOAL: ""
  LINEAR: "true"
  # RAW_OPEN/RAW_END let plan-phases/09-write-workflow.md show literal
  # {% raw %}/{% endraw %} tags to the planner LLM without confusing Jinja2.
  RAW_OPEN: "{% raw %}"
  RAW_END: "{% endraw %}"

phases:
  - id: plan-draft
    prompt_file: plan-phases/01-plan-draft.md

  - id: plan-smokecheck
    type: check
    bounce_target: plan-draft
    prompt_file: plan-phases/02-plan-smokecheck.md

  - id: plan-refine
    interactive: true
    prompt_file: plan-phases/03-plan-refine.md

  - id: plan-review
    type: check
    bounce_target: plan-refine
    prompt_file: plan-phases/04-plan-review.md

  - id: plan-cleanup
    prompt_file: plan-phases/05-plan-cleanup.md

  - id: plan-cleanup-review
    type: check
    bounce_target: plan-cleanup
    prompt_file: plan-phases/06-plan-cleanup-review.md

  - id: plan-split
    prompt_file: plan-phases/07-plan-split.md

  - id: plan-split-review
    type: check
    bounce_target: plan-split
    prompt_file: plan-phases/08-plan-split-review.md

  - id: write-workflow
    prompt_file: plan-phases/09-write-workflow.md

  - id: yaml-validate
    type: check
    bounce_target: write-workflow
    prompt: |
      Run this command from the working directory to verify that `workflow.yaml` is valid YAML with a top-level `phases` key:

      ```bash
      python -c "import yaml, sys; d=yaml.safe_load(open('workflow.yaml')); assert isinstance(d,dict) and 'phases' in d, 'missing phases key'"
      ```

      Do not modify any files while checking.
      If the command fails or reveals an invalid workflow shape, emit `VERDICT: FAIL: <reason>`.
      If it succeeds and the file looks structurally correct, emit `VERDICT: PASS`.

  - id: planned-workflow-validate
    type: check
    bounce_target: write-workflow
    prompt: |
      You MUST run this exact command from the working directory to validate `workflow.yaml` against
      `.plan/workflow-structure.yaml` and the standard Juvenal workflow rules, including Jinja2 syntax
      and renderability checks:

      ```bash
      python -m juvenal.plan_validation .plan/workflow-structure.yaml workflow.yaml {% if LINEAR == "true" %}--linear{% else %}--no-linear{% endif %}; echo "EXIT=$?"
      ```

      Do not skip this command. Do not substitute a different check (yaml.safe_load, a visual scan,
      etc.). Do not modify any files while checking.

      In your response, you MUST paste the literal stdout/stderr of the command AND the `EXIT=` line
      before your verdict, so the output can be audited.

      Verdict rules:
      - If the command prints any error line OR `EXIT=` is not `0`, emit
        `VERDICT: FAIL: <first error line from the command output>`.
      - Only if `EXIT=0` AND the command produced no error lines, emit `VERDICT: PASS`.

      Note: a programmatic gate re-runs this same validator after your verdict. Lying about a clean
      exit will not unblock the planner — it will just waste another retry cycle.

  - id: workflow-review
    type: check
    bounce_target: write-workflow
    prompt_file: plan-phases/10-workflow-review.md
